apiVersion: 1
groups:
    - orgId: 1
      name: manyak-server
      folder: manyak
      interval: 1m
      rules:
        - uid: fful0ju1pswe8c
          title: 수집 끊김 (서버 다운)
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: sum(rate(http_server_requests_milliseconds_count{service_name="manyak-server"}[5m]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: Alerting
          execErrState: Error
          for: 10m
          annotations:
            summary: 메트릭 수집이 끊겼습니다. 서버 또는 OTLP push 확인 필요.
          isPaused: false
          notification_settings:
            receiver: slack-그라파나-알림
        - uid: aful0qstdc0sga
          title: AI 실패 급증
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: sum(increase(manyak_ai_call_duration_milliseconds_count{service_name="manyak-server", outcome="failure"}[10m]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 5
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: 10분간 AI 호출 실패 5건 초과. 대시보드에서 feature별 실패율 확인.
          isPaused: false
          notification_settings:
            receiver: slack-그라파나-알림
        - uid: bful0tg9k5kowa
          title: 환불 실패
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: grafanacloud-prom
              model:
                editorMode: code
                expr: sum(increase(manyak_chat_turn_refund_total{service_name="manyak-server", outcome="failure"}[10m]))
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: OK
          execErrState: Error
          annotations:
            summary: 환불 실패. 사용자가 실패한 턴에 과금된 채 남았습니다. chat_turn_refund_failed 로그에서 idempotency_key·chat_pk 대조.
          isPaused: false
          notification_settings:
            receiver: slack-그라파나-알림
