# Fluent Bit 파서 정의(KNK-853). fluent-bit.conf 의 [FILTER] parser 가 이름으로 참조한다.

[PARSER]
    Name        manyak_json
    Format      json
    # 우리 로그의 시각 필드. LogstashEncoder 가 @timestamp 로 낸다.
    Time_Key    @timestamp
    # 로컬(bootRun)은 `2026-08-19T21:48:38.657697+09:00`, 운영(컨테이너)은 `...Z` 로 온다.
    # %L 이 소수점 이하를, %z 가 타임존을 받는다.
    Time_Format %Y-%m-%dT%H:%M:%S.%L%z
    # 파싱에 쓴 @timestamp 를 레코드에 **남긴다**. Off면 필드가 사라져 OpenSearch 쪽 시간축이 비는데,
    # 우리 인덱스 템플릿이 @timestamp 를 date 로 매핑해 두었으므로 실제 시간 해석은 OpenSearch가 한다.
    # 즉 여기 Time_Format 이 어긋나도 @timestamp 필드만 남으면 색인은 정상이다(이중 안전장치).
    Time_Keep   On
