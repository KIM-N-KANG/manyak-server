# Fluent Bit 설정(KNK-853). 로컬 학습용이며, 여기서 검증한 FILTER·OUTPUT을 나중에
# 개발 서버 FireLens(KNK-855)로 옮긴다. FireLens가 곧 Fluent Bit이라 설정 문법이 같다.
#
# 구조는 셋뿐이다.
#   INPUT  : 로그를 어디서 가져올까
#   FILTER : 어떻게 가공할까
#   OUTPUT : 어디로 보낼까

[SERVICE]
    # 모아둔 로그를 몇 초마다 내보낼지. 로컬은 확인 회전을 빠르게 하려고 1초로 둔다.
    Flush        1
    Log_Level    info
    # 종료 신호를 받으면 5초까지 남은 로그를 밀어내고 끝낸다(유실 방지).
    Grace        5
    # 아래 FILTER가 쓰는 파서 정의 파일. 이미지 기본 파일(/fluent-bit/etc/parsers.conf)을
    # 우리 것으로 덮어 마운트한다.
    Parsers_File parsers.conf

# ─── INPUT ───────────────────────────────────────────────────────────────
# 도커의 fluentd 로그 드라이버가 보내오는 것을 받는다.
# 운영(ECS FireLens)도 같은 프로토콜(forward)로 받으므로 입력 모양이 동일하다.
#
# 주의: 로그 드라이버는 컨테이너가 아니라 **도커 데몬**이 실행한다. 그래서 데몬 입장에서
# 닿을 수 있는 주소여야 하고, compose에서 24224 포트를 호스트로 게시해 둬야 한다.
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# ─── FILTER ──────────────────────────────────────────────────────────────
# 로그 드라이버가 보내는 레코드는 이렇게 생겼다.
#   { "log": "{\"@timestamp\":...,\"level\":\"INFO\",...}", "container_name": "/manyak-app", ... }
# 즉 우리 JSON이 `log` 필드 안에 **문자열로** 들어 있다. 이대로 색인하면 필드가 하나뿐이라
# level·status_code 같은 걸로 검색할 수 없다. 그래서 `log`를 JSON으로 파싱해 펼친다.
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       manyak_json
    # 파싱 결과에 원래 레코드의 나머지 필드(container_name 등)를 남긴다.
    # Off로 두면 container_name이 사라져 어느 컨테이너 로그인지 알 수 없다.
    Reserve_Data On

# ─── OUTPUT ──────────────────────────────────────────────────────────────
# OpenSearch로 직접 보내지 않고 **Vector를 거친다**(vector.yaml).
# Fluent Bit은 앱 옆에 붙는 가벼운 수집기 역할만 하고, 가공·버퍼링은 중앙의 Vector가 맡는다.
# 목적지가 잠깐 죽었을 때 로그를 잃지 않으려면 디스크 버퍼가 있는 계층이 필요한데,
# 도커 로그 드라이버(fluentd-async)의 메모리 버퍼는 한도를 넘으면 그냥 버린다(실측 확인).
#
# OpenSearch로 직접 쏘고 싶으면 아래를 지우고 Name/Host/Port/Logstash_* 설정으로 되돌리면 된다.
#
# **forward가 아니라 HTTP를 쓰는 이유(실측):**
# forward(fluentd 프로토콜)로 보내면 Vector가 `Error decoding fluent message ... parser_failed` 로 거절한다.
# Fluent Bit 5.x가 각 항목을 `[[시각, 메타데이터], 레코드]` 인 **v2 이벤트 형식**으로 보내는데
# Vector의 `fluent` 소스가 이 형식을 아직 해석하지 못한다. 데이터는 도착하지만 통째로 버려진다.
# HTTP + JSON 은 양쪽 다 단순히 지원하므로 이 문제가 없다.
[OUTPUT]
    Name   http
    Match  *
    Host   vector
    Port   24225
    URI    /
    # 한 줄에 JSON 하나씩(NDJSON). Vector 쪽 encoding=ndjson 과 짝이다.
    Format json_lines
    # Fluent Bit이 자기 시각 필드를 덧붙이지 않게 끈다.
    # 우리 레코드에는 이미 @timestamp 가 있고(파서의 Time_Keep On), 그게 정본이다.
    Json_date_key false
