# Fluent Bit 설정(KNK-853). 로컬 학습용이며, 여기서 검증한 FILTER·OUTPUT을 나중에
# 개발 서버 FireLens(KNK-855)로 옮긴다. FireLens가 곧 Fluent Bit이라 설정 문법이 같다.
#
# 구조는 셋뿐이다.
#   INPUT  : 로그를 어디서 가져올까
#   FILTER : 어떻게 가공할까
#   OUTPUT : 어디로 보낼까

[SERVICE]
    # 모아둔 로그를 몇 초마다 내보낼지. 로컬은 확인 회전을 빠르게 하려고 1초로 둔다.
    Flush        1
    Log_Level    info
    # 종료 신호를 받으면 5초까지 남은 로그를 밀어내고 끝낸다(유실 방지).
    Grace        5
    # 아래 FILTER가 쓰는 파서 정의 파일. 이미지 기본 파일(/fluent-bit/etc/parsers.conf)을
    # 우리 것으로 덮어 마운트한다.
    Parsers_File parsers.conf

# ─── INPUT ───────────────────────────────────────────────────────────────
# 도커의 fluentd 로그 드라이버가 보내오는 것을 받는다.
# 운영(ECS FireLens)도 같은 프로토콜(forward)로 받으므로 입력 모양이 동일하다.
#
# 주의: 로그 드라이버는 컨테이너가 아니라 **도커 데몬**이 실행한다. 그래서 데몬 입장에서
# 닿을 수 있는 주소여야 하고, compose에서 24224 포트를 호스트로 게시해 둬야 한다.
[INPUT]
    Name    forward
    Listen  0.0.0.0
    Port    24224

# ─── FILTER ──────────────────────────────────────────────────────────────
# 로그 드라이버가 보내는 레코드는 이렇게 생겼다.
#   { "log": "{\"@timestamp\":...,\"level\":\"INFO\",...}", "container_name": "/manyak-app", ... }
# 즉 우리 JSON이 `log` 필드 안에 **문자열로** 들어 있다. 이대로 색인하면 필드가 하나뿐이라
# level·status_code 같은 걸로 검색할 수 없다. 그래서 `log`를 JSON으로 파싱해 펼친다.
[FILTER]
    Name         parser
    Match        *
    Key_Name     log
    Parser       manyak_json
    # 파싱 결과에 원래 레코드의 나머지 필드(container_name 등)를 남긴다.
    # Off로 두면 container_name이 사라져 어느 컨테이너 로그인지 알 수 없다.
    Reserve_Data On

# ─── OUTPUT ──────────────────────────────────────────────────────────────
[OUTPUT]
    Name             opensearch
    Match            *
    # 컨테이너 네트워크 안이라 localhost가 아니라 서비스 이름으로 찾는다.
    Host             opensearch
    Port             9200
    # 보안 플러그인을 껐으므로 TLS·인증 없이 붙는다(로컬 전용).
    tls              Off
    # 날짜별 인덱스(manyak-logs-local-2026.08.19)를 만든다. 보관 정책(ISM)을 날짜 단위로
    # 걸어 통째로 지우기 위해서다. manyak-logs-* 라야 우리 인덱스 템플릿이 적용된다.
    Logstash_Format  On
    Logstash_Prefix  manyak-logs-local
    Logstash_DateFormat %Y.%m.%d
    # OpenSearch는 문서 타입(_type)을 쓰지 않는다. 켜 두면 bulk 요청에 _type이 실려 색인이 거절된다.
    Suppress_Type_Name On
