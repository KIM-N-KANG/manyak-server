# Fluent Bit 설정(KNK-853). 로컬 학습용이며, 여기서 검증한 FILTER·OUTPUT을 나중에
# 개발 서버 FireLens(KNK-855)로 옮긴다. FireLens가 곧 Fluent Bit이라 설정 문법이 같다.
#
# 구조는 셋뿐이다.
#   INPUT  : 로그를 어디서 가져올까
#   FILTER : 어떻게 가공할까
#   OUTPUT : 어디로 보낼까
# 한 번에 셋을 다 맞추려 하면 어디서 틀렸는지 못 찾으므로 단계적으로 늘린다.

[SERVICE]
    # 모아둔 로그를 몇 초마다 내보낼지. 로컬은 확인 회전을 빠르게 하려고 1초로 둔다.
    Flush        1
    Log_Level    info
    # 종료 신호를 받으면 5초까지 남은 로그를 밀어내고 끝낸다(유실 방지).
    Grace        5

# ─── INPUT ───────────────────────────────────────────────────────────────
# 1단계: 가짜 로그를 만들어내는 입력. 진짜 앱을 붙이기 전에 OpenSearch까지 가는
# 배관이 뚫렸는지만 확인하는 용도다. 배관이 확인되면 이 블록을 실제 입력으로 교체한다.
[INPUT]
    Name     dummy
    Tag      test.dummy
    # 우리 로그 스키마(LogstashEncoder)와 같은 모양으로 만들어, 인덱스 템플릿이
    # 의도대로 타입을 잡는지도 함께 확인한다.
    Dummy    {"@timestamp":"2026-01-01T00:00:00.000Z","level":"INFO","service":"fluent-bit-test","message":"배관 확인용 가짜 로그","status_code":200,"duration_ms":7}
    # 1초에 1건만. 기본값(무제한)으로 두면 순식간에 수만 건이 쌓인다.
    Rate     1

# ─── OUTPUT ──────────────────────────────────────────────────────────────
[OUTPUT]
    Name             opensearch
    Match            *
    # 컨테이너 네트워크 안이라 localhost가 아니라 서비스 이름으로 찾는다.
    Host             opensearch
    Port             9200
    # 보안 플러그인을 껐으므로 TLS·인증 없이 붙는다(로컬 전용).
    tls              Off
    # 인덱스 이름. manyak-logs-* 라야 우리 템플릿이 적용된다.
    Index            manyak-logs-local-test
    # OpenSearch는 문서 타입(_type)을 쓰지 않는다. 켜 두면 bulk 요청에 _type이 실려
    # `Rejecting mapping update ... final mapping would have more than 1 type` 로 색인이 거절된다.
    Suppress_Type_Name On
