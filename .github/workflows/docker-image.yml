name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR(dev) 푸시
  id-token: write # AWS OIDC(dev·main) 인증

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-server
  ECR_REPOSITORY: manyak-server
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: manyak-dev
  ECS_SERVICE: manyak-dev

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시 → 개발용 GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 푸시 → 배포용 ECR (OIDC, 장기 키 미보관)
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # 대상 레지스트리/태그 결정: main → ECR(latest, short-sha), 그 외 → GHCR(dev, short-sha)
      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${ECR_REPOSITORY}:latest"
              echo "${REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # dev 브랜치는 여기서 :dev 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :dev 를 옛 SHA 로 되돌릴 수 있다.
            # :dev 승격은 deploy-dev 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-829).
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # dev 푸시(GHCR 갱신) 후 → 개발 ECS 서비스에 새 배포를 트리거 + 헬스 스모크 (KNK-829)
  deploy-dev:
    name: Deploy to ECS (dev)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # 운영과 같은 이유로 직렬화한다. cancel-in-progress=false — 이미 ECS 로 dispatch 된 배포는
    # GitHub 잡을 취소해도 되돌릴 수 없어서, 취소보다 큐잉이 안전하다.
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # GHCR 의 dev 는 가변 태그다. 이 잡은 "현재 dev 태그"를 배포하므로, 더 새 푸시가 있으면
      # 그쪽 잡이 배포하게 두고 여기서는 건너뛴다(오래된 실행이 나중에 끝나 되돌리는 일을 막는다).
      - name: Gate — 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다(리뷰 지적). manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태스크 정의는 이미 GHCR dev 좌표를 들고 있으므로 새 리비전을 등록하지 않는다.
      # force-new-deployment 가 같은 정의로 태스크를 다시 띄우면서 이미지를 다시 pull 한다.
      #
      # 개발은 server·ai 가 태스크 정의 하나에 함께 있어, 이 배포는 두 컨테이너를 모두
      # 현재 GHCR dev 이미지로 갱신한다(ai 만 머지해도 server 가 함께 바뀐다).
      - name: Force new ECS deployment
        if: steps.gate.outputs.skip != 'true'
        run: |
          # 이 호출이 만든 배포 id 를 잡아 둔다. services-stable 만으로는 부족하다 —
          # 서비스에 circuit breaker rollback 이 켜져 있어(compute-ecs), 새 태스크가 못 뜨면 ECS 가
          # 직전 배포로 되돌리고, 그 상태도 "안정적인 배포 1개 + desired 충족"이라 waiter 가 성공한다.
          # 그러면 이후 헬스 검사는 옛 태스크를 보게 되어 실패한 배포가 초록으로 끝난다.
          DEPLOY_ID=$(aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --no-cli-pager \
            --query "service.deployments[?status=='PRIMARY'].id | [0]" --output text)
          echo "배포 id: $DEPLOY_ID"

          # 그 배포가 COMPLETED 가 될 때까지 폴링한다. 롤백되면 rolloutState 가 FAILED 가 되거나
          # 배포 자체가 목록에서 사라지므로 둘 다 실패로 처리한다.
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?id=='$DEPLOY_ID'].rolloutState | [0]" --output text)
            case "$STATE" in
              COMPLETED) echo "✅ 배포 $DEPLOY_ID COMPLETED"; break ;;
              FAILED) echo "::error::배포 $DEPLOY_ID 가 FAILED — circuit breaker 롤백 발생. CloudWatch /ecs/manyak-dev 확인"; exit 1 ;;
              None|"") echo "::error::배포 $DEPLOY_ID 가 사라졌습니다(롤백으로 교체) — CloudWatch /ecs/manyak-dev 확인"; exit 1 ;;
              *) echo "배포 $STATE — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATE" = "COMPLETED" ]
          # 배포 안정화까지 대기. 개발 서비스는 stop-then-start(겹치지 않음)라 그 사이 짧은 중단이 있다.

      # server 가 healthy 여도 ai 는 죽어 있을 수 있다 — ai 컨테이너는 essential=false 라
      # 태스크를 죽이지 않고, ALB 헬스는 server 만 본다. 그래서 컨테이너 단위로 따로 확인한다.
      - name: Verify container health (server·ai)
        if: steps.gate.outputs.skip != 'true'
        run: |
          TASK=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --query 'taskArns[0]' --output text)
          aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[].{name:name,status:lastStatus,health:healthStatus}' --output table
          # 단발 검사는 안 된다. 배포 완료 시점에도 ai 는 아직 UNKNOWN 일 수 있다 —
          # 태스크 헬스체크에 start period 와 재시도가 있고, ai 는 essential=false 라
          # 배포 완료 판정이 ai 의 healthy 를 기다려 주지 않는다. 정상 기동 중인 컨테이너를
          # 실패로 떨어뜨리지 않도록, 전부 HEALTHY 가 되거나 종료 상태가 될 때까지 폴링한다.
          # 문자열 매칭을 쓰지 않는다 — UNHEALTHY 도 "HEALTHY" 로 끝나서 부분일치로는 비정상을
          # 정상으로 오판한다. JMESPath 로 정확히 비교해 개수를 센다.
          for i in $(seq 1 20); do
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
              --query 'tasks[0].containers[].{name:name,status:lastStatus,health:healthStatus}' --output table
            PENDING=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
              --query "length(tasks[0].containers[?healthStatus!='HEALTHY'])" --output text)
            if [ "$PENDING" = "0" ]; then
              echo "✅ 컨테이너 전부 HEALTHY"; exit 0
            fi
            BAD=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
              --query "length(tasks[0].containers[?healthStatus=='UNHEALTHY' || lastStatus=='STOPPED'])" --output text)
            if [ "$BAD" != "0" ]; then
              echo "::error::UNHEALTHY 또는 STOPPED 컨테이너가 있습니다 — CloudWatch /ecs/manyak-dev 로그 확인"
              exit 1
            fi
            echo "컨테이너 기동 대기 $i/20 (15s)..."; sleep 15
          done
          echo "::error::제한 시간 안에 전부 HEALTHY 가 되지 않았습니다 — CloudWatch /ecs/manyak-dev 로그 확인"; exit 1

      - name: Smoke test (/actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://dev-api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ dev health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::dev health 200/UP 확인 실패 — CloudWatch /ecs/manyak-dev 로그 확인"; exit 1

  # main 푸시(ECR 갱신) 후 → SSM Run Command 로 EC2에 배포 + 헬스 스모크
  deploy:
    name: Deploy to EC2 (prod)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포를 직렬화(큐잉)한다. cancel-in-progress=false: 진행 중 배포를 취소하지 않는다.
    # (true 면 SSM send-command 로 EC2에 이미 dispatch된 원격 배포는 못 막고 GitHub 잡만 취소돼 레이스가 남음)
    # 큐잉이라 푸시 순서대로 배포되어 최신 SHA 가 마지막에 반영된다.
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 빌드 시간차로 순서가 뒤집혀도 older SHA 가 배포되지 않도록, 이 run 의 SHA 가 main HEAD 인지 확인.
      # 아니면(더 새 푸시가 있으면) 이후 배포·스모크 스텝을 건너뛴다(concurrency 큐잉의 순서 미보장 보완).
      - name: Gate — 최신 main SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 main($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve target EC2 instance
        id: ec2
        if: steps.gate.outputs.skip != 'true'
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=manyak" "Name=tag:Name,Values=manyak-prod-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::running 상태의 manyak-prod-app EC2를 찾지 못했습니다 (manyak-terraform 레포에서 terraform apply 선행 필요)"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "대상 인스턴스: $INSTANCE_ID"

      - name: Deploy via SSM Run Command
        if: steps.gate.outputs.skip != 'true'
        run: |
          # 이 워크플로가 빌드·푸시한 정확한 이미지(short-sha)를 배포 — :latest 의 동시 push 모호성·추적성 문제 회피
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}"
          echo "배포 이미지: $IMAGE"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "manyak deploy ${GITHUB_SHA::7}" \
            --parameters commands="SERVER_IMAGE_OVERRIDE=$IMAGE bash /opt/manyak/deploy.sh" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          # terminal 상태까지 폴링 (기본 `wait command-executed` 의 100s 한계로 InProgress 를 실패로 오판하지 않도록)
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "✅ SSM Success"; break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::SSM $STATUS"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query "StandardErrorContent" --output text || true
                exit 1 ;;
              *) echo "SSM $STATUS — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATUS" = "Success" ]

      - name: Smoke test (/actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::health 200/UP 확인 실패 — 롤백 검토 (manyak-terraform 레포 참조)"; exit 1
