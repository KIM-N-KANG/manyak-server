name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read # 성공한 dev 워크플로 실행 확인
  packages: write # GHCR 푸시(dev, main)와 :dev, :prod 태그 이동
  id-token: write # AWS OIDC(dev·main) 인증

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-server
  ECR_REPOSITORY: manyak-server
  AWS_REGION: ap-northeast-2
  # 운영 단일 EC2 앱 호스트(KNK-2106, manyak-terraform envs/prod/app-host.tf). 배포는 서비스별 SSM 문서로 한다.
  PROD_DEPLOY_DOCUMENT: manyak-prod-host-deploy-server
  PROD_HOST_TAG: manyak-prod-host

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 성공한 dev 커밋의 트리 비교

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # main push만 dev의 성공한 동일 트리 검증을 재사용한다. 조회 실패·불일치는 항상 테스트한다.
      - name: Check successful dev tree
        id: dev-tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          HEAD_TREE=$(git rev-parse 'HEAD^{tree}')
          RUNS_FILE=$(mktemp)
          trap 'rm -f "$RUNS_FILE"' EXIT
          # 2026-10-07 실측: status=success 필터가 최신 실행을 빠뜨려 conclusion은 jq에서 검사한다.
          # 최신 dev push 100개면 충분하므로 첫 페이지만 조회한다.
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-image.yml/runs?branch=dev&event=push&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "dev" and .event == "push") | [.id, .head_sha] | @tsv' > "$RUNS_FILE"; then
            echo "::notice::dev 성공 실행 조회 실패: 테스트를 실행합니다 (tree=$HEAD_TREE)"
            exit 0
          fi
          while IFS=$'\t' read -r RUN_ID DEV_SHA; do
            [[ "$RUN_ID" =~ ^[0-9]+$ && "$DEV_SHA" =~ ^[0-9a-f]{40}$ ]] || continue
            if ! DEV_TREE=$(git rev-parse --verify "${DEV_SHA}^{tree}" 2>/dev/null); then
              continue
            fi
            if [ "$HEAD_TREE" = "$DEV_TREE" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "::notice::동일 트리의 dev 테스트 재사용: run=$RUN_ID sha=$DEV_SHA tree=$HEAD_TREE"
              exit 0
            fi
          done < "$RUNS_FILE"
          echo "::notice::동일 트리의 dev 성공 실행 없음: 테스트를 실행합니다 (tree=$HEAD_TREE)"

      - name: Test and build JAR
        id: test-build
        env:
          SKIP_TESTS: ${{ steps.dev-tests.outputs.skip }}
        run: |
          if [ "$SKIP_TESTS" = "true" ]; then
            ./gradlew bootJar --no-daemon
          else
            ./gradlew test bootJar --no-daemon
          fi

      # 테스트가 실패하면 원인을 볼 수 있게 결과를 남긴다(KNK-2070). 간헐 실패는 재실행하면 결과가 덮여 사라진다.
      - name: Upload test results on failure
        if: failure() && steps.test-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-attempt-${{ github.run_attempt }}
          path: |
            build/test-results/
            build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # 커버리지(KNK-2119). test가 끝나면 jacocoTestReport가 이어 돌므로 테스트를 돌린 실행에만 보고서가 있다.
      # 수치는 잡 요약에 표로, HTML 보고서는 아티팩트로 남긴다. 기준치로 빌드를 실패시키지 않는다.
      - name: Coverage summary
        if: always() && steps.dev-tests.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "build/reports/jacoco/test/jacocoTestReport.xml"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              if not os.path.exists(path):
                  out.write("### 테스트 커버리지\n\n보고서가 없습니다(테스트가 끝까지 돌지 않았습니다).\n")
                  raise SystemExit(0)
              # 보고서 루트의 counter가 전체 합계다(패키지·클래스 counter는 그 아래에 있다).
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}
              out.write("### 테스트 커버리지\n\n| 항목 | 비율 | 덮음 / 전체 |\n|---|---:|---:|\n")
              for kind, label in (("LINE", "라인"), ("BRANCH", "분기")):
                  covered = int(counters[kind].get("covered"))
                  total = covered + int(counters[kind].get("missed"))
                  out.write(f"| {label} | {covered / total:.1%} | {covered:,} / {total:,} |\n")
          PY

      - name: Upload coverage report
        if: always() && steps.dev-tests.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-attempt-${{ github.run_attempt }}
          path: build/reports/jacoco/test/html/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시 → 개발용 GHCR. main 푸시도 같은 이미지를 GHCR에 함께 올린다(KNK-2126, OCI 운영 호스트 전환 준비).
      - name: Log in to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 푸시 → 배포용 ECR (OIDC, 장기 키 미보관)
      # main 에서의 수동 실행(workflow_dispatch)도 포함한다. 인증을 건너뛰면 Resolve image tags 의
      # main 분기가 빈 registry 로 잘못된 태그를 만들어 빌드가 실패한다(KNK-963). 수동 실행은
      # 테스트·빌드와 ECR :short-sha 재push 까지만 하고, 배포(deploy-prod)는 push 이벤트 전용이다.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/amazon-ecr-login@v2

      # 대상 레지스트리/태그 결정: main → ECR(short-sha), main 푸시는 GHCR(short-sha)도, 그 외 → GHCR(short-sha)
      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # main 브랜치도 여기서 :latest 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :latest 를 옛 SHA 로 되돌릴 수 있다.
            # :latest 승격은 deploy-prod 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-963).
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            # main 푸시는 같은 빌드를 GHCR 에도 올린다(KNK-2126). 한 번에 두 레지스트리로 push 하므로 다이제스트가 같다.
            # OCI 운영 호스트는 GHCR :prod 를 따라가고, 전환 전에는 아무도 GHCR 운영 이미지를 받지 않는다.
            # 수동 실행은 지금처럼 ECR 재push 까지만 한다(GHCR 로그인은 push 이벤트 전용).
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
              if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
                echo "${GHCR_IMAGE}:${SHORT_SHA}"
              fi
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # dev 브랜치는 여기서 :dev 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :dev 를 옛 SHA 로 되돌릴 수 있다.
            # :dev 승격은 deploy-dev 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-829).
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci-runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # dev 푸시(GHCR 갱신) 후 → :dev 승격 + 헬스 스모크. dev 환경이 :dev를 자동으로 받아 교체한다 (KNK-829, KNK-2125)
  deploy-dev:
    name: Deploy to app host (dev)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # :dev 승격을 직렬화한다(늦게 끝난 옛 실행이 태그를 되돌리지 않게). 잡 이름은 체크 이름을 바꾸지 않으려고 그대로 둔다.
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # GHCR 의 dev 는 가변 태그다. 이 잡은 "현재 dev 태그"를 배포하므로, 더 새 푸시가 있으면
      # 그쪽 잡이 배포하게 두고 여기서는 건너뛴다(오래된 실행이 나중에 끝나 되돌리는 일을 막는다).
      - name: Gate — 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다(리뷰 지적). manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

      # dev 환경은 :dev 다이제스트가 바뀌면 스스로 pull하고 다시 만든다(KNK-2125). 여기서는 :dev만 옮기고 배포 명령을 보내지 않는다.
      # (예전 EC2 앱 호스트 SSM 배포 단계는 전환과 함께 뺐다.)

      # 공개 주소로 끝까지 닿는지 본다. 새 이미지 교체는 dev 환경이 따로 하므로 여기서 버전까지 맞추지는 않는다.
      - name: Smoke test (/actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://dev-api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ dev health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::dev health 200/UP 확인 실패. dev 환경의 server 상태와 로그 확인"; exit 1


  # main 푸시(ECR 갱신) 후 → 운영 앱 호스트에 SSM 문서로 배포 + 헬스 스모크 (KNK-2106, 예전 ECS 는 KNK-963)
  deploy-prod:
    name: Deploy to app host (prod)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포를 직렬화(큐잉)한다. cancel-in-progress=false — 이미 호스트로 보낸 배포 명령은 GitHub 잡을 취소해도
    # 되돌릴 수 없어서, 취소보다 큐잉이 안전하다. 세 앱 레포 사이의 직렬화는 호스트의 deploy.sh 가 flock 으로 한다
    # (예전 "Wait for service to settle" 단계가 하던 일).
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 배포 대상은 "이 실행의 커밋"이 아니라 "현재 main HEAD"다.
      # 예전처럼 "내가 HEAD 가 아니면 skip" 하면 최신 커밋이 아무 데서도 배포되지 않을 수 있다 —
      # GitHub concurrency 는 대기 슬롯이 1개라, 늦게 끝난 옛 빌드의 잡이 큐에서 기다리던 최신
      # 실행을 밀어내 취소시키고, 정작 자기는 게이트에서 skip 하기 때문이다.
      # 어느 실행이 돌든 항상 HEAD 를 배포하면 그 구멍이 사라진다(중복 배포는 같은 이미지라 무해).
      - name: Gate — 배포 대상(main HEAD) 확인
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          {
            echo "deploy_sha=$DEPLOY_SHA"
            echo "deploy_short_sha=${DEPLOY_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "배포 대상 main HEAD: $DEPLOY_SHA (이 실행의 커밋: $GITHUB_SHA)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # HEAD 의 이미지가 아직 ECR 에 없으면 = HEAD 빌드가 아직 안 끝났다는 뜻이라 여기서 멈춘다.
      # 실패가 아니다 — 그 커밋 자신의 실행이 배포한다. 매니페스트 조회는 pull 권한(ecr:BatchGetImage)으로 된다.
      - name: Check image for main HEAD
        id: image
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if OUT=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "배포 이미지 확인: $IMAGE"
            exit 0
          fi
          echo "$OUT"
          # 조회 실패를 뭉뚱그려 "아직 빌드 안 됨"으로 넘기지 않는다(fail-closed).
          if [ "${{ steps.gate.outputs.deploy_sha }}" = "$GITHUB_SHA" ]; then
            echo "::error::이 실행이 방금 push 한 HEAD 이미지($IMAGE)를 조회하지 못했습니다 — 빌드 또는 권한 문제"
            exit 1
          fi
          if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD(${{ steps.gate.outputs.deploy_short_sha }}) 이미지가 아직 ECR 에 없습니다(매니페스트 부재로 판별) — 그 커밋의 실행이 배포합니다"
            exit 0
          fi
          echo "::error::이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다(인증·네트워크 등) — 위 출력 확인"
          exit 1

      # 운영 앱 호스트의 deploy.sh 를 SSM 문서(manyak-prod-host-deploy-server)로 부른다(KNK-2106). 22 번도 SSH 키도 없다.
      # deploy.sh: 새 server 컨테이너 기동 → 헬스 통과 → kamal-proxy 전환 → 옛 컨테이너의 진행 중 요청(SSE) 드레인(240초)
      # → 옛 컨테이너 정지. 새 컨테이너가 헬스를 못 넘으면 지우고 실패로 끝나며 옛 server 가 계속 서비스한다.
      # 불변 태그(:<sha7>)로 배포하고, 호스트가 현재·직전 이미지를 기록한다(/data/state, image=rollback 으로 되돌림).
      # 배포 확인: 예전의 태스크 정의·배포 id 대조 대신, deploy.sh 가 끝에 찍는 "deployed <image>" 줄이 요청한 이미지인지 본다.
      - name: Deploy to prod app host (SSM)
        id: deploy
        if: steps.image.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          CID=$(aws ssm send-command --document-name "$PROD_DEPLOY_DOCUMENT" \
            --targets "Key=tag:manyak:host,Values=$PROD_HOST_TAG" --parameters "image=$IMAGE" \
            --timeout-seconds 600 --query Command.CommandId --output text)
          echo "SSM 명령 $CID ($IMAGE)"
          # 드레인(최대 240초)과 기동(약 1분), 다른 레포 배포의 잠금 대기까지 넉넉히 기다린다(최대 30분).
          IID=""
          for i in $(seq 1 180); do
            sleep 10
            if [ -z "$IID" ] || [ "$IID" = "None" ]; then
              IID=$(aws ssm list-command-invocations --command-id "$CID" --query 'CommandInvocations[0].InstanceId' --output text)
              [ -n "$IID" ] && [ "$IID" != "None" ] || { echo "명령 전달 대기 $i"; continue; }
            fi
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "배포 $STATUS — 대기 $i/180 (10s)" ;;
              *) break ;;
            esac
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true)
          echo "$OUT"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::운영 앱 호스트 배포가 $STATUS 로 끝났습니다. 옛 server 가 계속 서비스합니다. 위 출력과 CloudWatch /manyak/prod/app-host 확인"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -qF "server: deployed $IMAGE as "; then
            echo "::error::배포 명령은 성공했지만 출력에서 'deployed $IMAGE' 를 찾지 못했습니다 — 호스트의 /data/state/server.image 확인"
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 운영 앱 호스트 배포 완료: $IMAGE"

      # 컨테이너 헬스는 deploy.sh 가 전환 전에 확인했다. 여기서는 공개 주소로 끝까지 닿는지 본다.
      - name: Smoke test (/actuator/health)
        if: steps.image.outputs.exists == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::health 200/UP 확인 실패 — CloudWatch /manyak/prod/app-host 로그 확인"; exit 1

      # 전환은 됐는데 공개 주소 스모크가 실패하면 직전 이미지로 되돌린다(같은 무중단 절차). 완료를 기다리지 않는다 —
      # 잡은 이미 실패이고, 되돌린 결과는 호스트 기록과 다음 스모크로 확인한다.
      - name: Roll back on smoke failure
        if: failure() && steps.deploy.outputs.deployed == 'true'
        run: |
          CID=$(aws ssm send-command --document-name "$PROD_DEPLOY_DOCUMENT" \
            --targets "Key=tag:manyak:host,Values=$PROD_HOST_TAG" --parameters "image=rollback" \
            --timeout-seconds 600 --query Command.CommandId --output text)
          echo "::warning::스모크 실패로 image=rollback 을 보냈습니다(SSM 명령 $CID). 완료와 헬스를 직접 확인하세요"

      # 배포가 끝난 뒤에만 :latest 를 main HEAD 로 옮긴다. 호스트는 불변 태그로 배포하므로 :latest 는 호스트 기록이
      # 없을 때의 기본값(새 데이터 디스크)과 옛 ECS 로 되돌릴 때 쓰인다. 실패한 배포는 :latest 를 건드리지 않으므로
      # 예전의 ":latest 복구" 단계가 필요 없다. manifest 를 복사하므로 멀티아키 인덱스가 유지된다.
      - name: Promote main HEAD to :latest
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "✅ :latest -> ${{ steps.gate.outputs.deploy_short_sha }}"

      # AWS 배포와 공개 주소 스모크가 성공한 이미지만 GHCR :prod 로 옮긴다(KNK-2126). OCI 운영 호스트의 updater 가
      # :prod 다이제스트를 따라 배포한다. 전환 전에는 아무도 :prod 를 받지 않아 영향이 없다. 직렬화 구간 안이라 옛 실행이
      # 태그를 되돌리지 않는다. 이 변경 전에 빌드된 HEAD 는 GHCR 에 :<sha7> 이 없어 건너뛴다(실패 아님).
      # 그 밖의 조회 실패는 실패로 남긴다. 이 단계는 되돌리기 단계 뒤라 여기서 실패해도 AWS 배포를 되돌리지 않는다.
      # 되돌리기는 수동 워크플로 prod-rollback.yml 이 :prod 를 입력 sha 로 옮긴다.
      - name: Promote main HEAD to GHCR :prod
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SOURCE="${GHCR_IMAGE}:${{ steps.gate.outputs.deploy_short_sha }}"
          if ! OUT=$(docker buildx imagetools inspect "$SOURCE" 2>&1); then
            echo "$OUT"
            if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
              echo "::notice::GHCR 에 $SOURCE 가 없어 :prod 를 옮기지 않습니다(이 변경 전에 빌드된 커밋)"
              exit 0
            fi
            echo "::error::GHCR 이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다. :prod 는 그대로입니다(AWS 배포는 끝남)"
            exit 1
          fi
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "$SOURCE"
          echo "✅ GHCR :prod -> ${{ steps.gate.outputs.deploy_short_sha }}"
