name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read # 성공한 dev 워크플로 실행 확인
  packages: write # GHCR 푸시(dev, main)와 :dev, :prod 태그 이동

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-server

jobs:
  build:
    name: Test and build image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 성공한 dev 커밋의 트리 비교

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # main push만 dev의 성공한 동일 트리 검증을 재사용한다. 조회 실패·불일치는 항상 테스트한다.
      - name: Check successful dev tree
        id: dev-tests
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "skip=false" >> "$GITHUB_OUTPUT"
          HEAD_TREE=$(git rev-parse 'HEAD^{tree}')
          RUNS_FILE=$(mktemp)
          trap 'rm -f "$RUNS_FILE"' EXIT
          # 2026-10-07 실측: status=success 필터가 최신 실행을 빠뜨려 conclusion은 jq에서 검사한다.
          # 최신 dev push 100개면 충분하므로 첫 페이지만 조회한다.
          if ! gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/docker-image.yml/runs?branch=dev&event=push&per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success" and .head_branch == "dev" and .event == "push") | [.id, .head_sha] | @tsv' > "$RUNS_FILE"; then
            echo "::notice::dev 성공 실행 조회 실패: 테스트를 실행합니다 (tree=$HEAD_TREE)"
            exit 0
          fi
          while IFS=$'\t' read -r RUN_ID DEV_SHA; do
            [[ "$RUN_ID" =~ ^[0-9]+$ && "$DEV_SHA" =~ ^[0-9a-f]{40}$ ]] || continue
            if ! DEV_TREE=$(git rev-parse --verify "${DEV_SHA}^{tree}" 2>/dev/null); then
              continue
            fi
            if [ "$HEAD_TREE" = "$DEV_TREE" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              echo "::notice::동일 트리의 dev 테스트 재사용: run=$RUN_ID sha=$DEV_SHA tree=$HEAD_TREE"
              exit 0
            fi
          done < "$RUNS_FILE"
          echo "::notice::동일 트리의 dev 성공 실행 없음: 테스트를 실행합니다 (tree=$HEAD_TREE)"

      - name: Test and build JAR
        id: test-build
        env:
          SKIP_TESTS: ${{ steps.dev-tests.outputs.skip }}
        run: |
          if [ "$SKIP_TESTS" = "true" ]; then
            ./gradlew bootJar --no-daemon
          else
            ./gradlew test bootJar --no-daemon
          fi

      # 테스트가 실패하면 원인을 볼 수 있게 결과를 남긴다(KNK-2070). 간헐 실패는 재실행하면 결과가 덮여 사라진다.
      - name: Upload test results on failure
        if: failure() && steps.test-build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: test-results-attempt-${{ github.run_attempt }}
          path: |
            build/test-results/
            build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      # 커버리지(KNK-2119). test가 끝나면 jacocoTestReport가 이어 돌므로 테스트를 돌린 실행에만 보고서가 있다.
      # 수치는 잡 요약에 표로, HTML 보고서는 아티팩트로 남긴다. 기준치로 빌드를 실패시키지 않는다.
      - name: Coverage summary
        if: always() && steps.dev-tests.outputs.skip != 'true'
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          path = "build/reports/jacoco/test/jacocoTestReport.xml"
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              if not os.path.exists(path):
                  out.write("### 테스트 커버리지\n\n보고서가 없습니다(테스트가 끝까지 돌지 않았습니다).\n")
                  raise SystemExit(0)
              # 보고서 루트의 counter가 전체 합계다(패키지·클래스 counter는 그 아래에 있다).
              counters = {c.get("type"): c for c in ET.parse(path).getroot().findall("counter")}
              out.write("### 테스트 커버리지\n\n| 항목 | 비율 | 덮음 / 전체 |\n|---|---:|---:|\n")
              for kind, label in (("LINE", "라인"), ("BRANCH", "분기")):
                  covered = int(counters[kind].get("covered"))
                  total = covered + int(counters[kind].get("missed"))
                  out.write(f"| {label} | {covered / total:.1%} | {covered:,} / {total:,} |\n")
          PY

      - name: Upload coverage report
        if: always() && steps.dev-tests.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-attempt-${{ github.run_attempt }}
          path: build/reports/jacoco/test/html/
          if-no-files-found: ignore
          retention-days: 7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev, main 푸시와 main 수동 실행은 GHCR :<sha7>로 올린다. 운영(OCI)은 GHCR :prod를 따라간다(KNK-2126).
      # 빌드 잡에서 :dev, :prod를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다.
      # 가변 태그는 각 배포 잡의 최신 SHA 게이트 뒤(직렬화 구간)에서 옮긴다(KNK-829, KNK-963).
      - name: Log in to GHCR
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image-tags
        run: echo "tags=${GHCR_IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ci-runtime
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # dev 푸시(GHCR 갱신) 후 → :dev 승격 + 헬스 스모크. dev 환경이 :dev를 자동으로 받아 교체한다 (KNK-829, KNK-2125)
  deploy-dev:
    name: Deploy to app host (dev)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # :dev 승격을 직렬화한다(늦게 끝난 옛 실행이 태그를 되돌리지 않게). 잡 이름은 체크 이름을 바꾸지 않으려고 그대로 둔다.
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # GHCR 의 dev 는 가변 태그다. 이 잡은 "현재 dev 태그"를 배포하므로, 더 새 푸시가 있으면
      # 그쪽 잡이 배포하게 두고 여기서는 건너뛴다(오래된 실행이 나중에 끝나 되돌리는 일을 막는다).
      - name: Gate — 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다(리뷰 지적). manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

      # dev 환경은 :dev 다이제스트가 바뀌면 스스로 pull하고 다시 만든다(KNK-2125). 여기서는 :dev만 옮기고 배포 명령을 보내지 않는다.
      # (예전 EC2 앱 호스트 SSM 배포 단계는 전환과 함께 뺐다.)

      # 공개 주소로 끝까지 닿는지 본다. 새 이미지 교체는 dev 환경이 따로 하므로 여기서 버전까지 맞추지는 않는다.
      - name: Smoke test (/actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://dev-api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ dev health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::dev health 200/UP 확인 실패. dev 환경의 server 상태와 로그 확인"; exit 1


  # main 푸시 후 → GHCR :prod 를 main HEAD 로 옮기고, OCI 운영 호스트가 바꿔 띄울 때까지 기다린 뒤 공개 스모크 (KNK-2126).
  # CI 는 호스트에 명령을 보내지 않는다. 호스트의 updater(systemd 타이머, 앞 실행이 끝나고 60초 뒤 다시 돈다)가
  # :prod 다이제스트가 지금 이미지와 다르면 deploy.sh 로 무중단 배포한다(새 컨테이너 헬스 → kamal-proxy 전환 → 옛 컨테이너 드레인).
  # 새 컨테이너가 헬스를 못 넘으면 옛 server 가 계속 서비스하고, 그 다이제스트는 실패로 기록돼 다시 시도하지 않는다.
  # 정본: manyak-terraform oci/prod/scripts/update.sh, oci/prod/deploy.sh
  deploy-prod:
    name: Deploy to app host (prod)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # :prod 이동을 직렬화(큐잉)한다. 늦게 끝난 옛 실행이 :prod 를 되돌리지 않게 한다.
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 배포 대상은 "이 실행의 커밋"이 아니라 "현재 main HEAD"다.
      # 예전처럼 "내가 HEAD 가 아니면 skip" 하면 최신 커밋이 아무 데서도 배포되지 않을 수 있다 —
      # GitHub concurrency 는 대기 슬롯이 1개라, 늦게 끝난 옛 빌드의 잡이 큐에서 기다리던 최신
      # 실행을 밀어내 취소시키고, 정작 자기는 게이트에서 skip 하기 때문이다.
      # 어느 실행이 돌든 항상 HEAD 를 배포하면 그 구멍이 사라진다(중복 배포는 같은 이미지라 무해).
      - name: Gate — 배포 대상(main HEAD) 확인
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          {
            echo "deploy_sha=$DEPLOY_SHA"
            echo "deploy_short_sha=${DEPLOY_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "배포 대상 main HEAD: $DEPLOY_SHA (이 실행의 커밋: $GITHUB_SHA)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HEAD 의 이미지가 아직 GHCR 에 없으면 = HEAD 빌드가 아직 안 끝났다는 뜻이라 여기서 멈춘다.
      # 실패가 아니다 — 그 커밋 자신의 실행이 배포한다.
      - name: Check image for main HEAD
        id: image
        run: |
          IMAGE="${GHCR_IMAGE}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if OUT=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "배포 이미지 확인: $IMAGE"
            exit 0
          fi
          echo "$OUT"
          # 조회 실패를 뭉뚱그려 "아직 빌드 안 됨"으로 넘기지 않는다(fail-closed).
          if [ "${{ steps.gate.outputs.deploy_sha }}" = "$GITHUB_SHA" ]; then
            echo "::error::이 실행이 방금 push 한 HEAD 이미지($IMAGE)를 조회하지 못했습니다 — 빌드 또는 권한 문제"
            exit 1
          fi
          if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD(${{ steps.gate.outputs.deploy_short_sha }}) 이미지가 아직 GHCR 에 없습니다(매니페스트 부재로 판별) — 그 커밋의 실행이 배포합니다"
            exit 0
          fi
          echo "::error::이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다(인증·네트워크 등) — 위 출력 확인"
          exit 1

      # 지금 :prod 다이제스트를 남겨 두고(스모크가 실패하면 되돌릴 곳) :prod 를 main HEAD 로 옮긴다. 이것이 배포다.
      # manifest 를 복사하므로 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Move GHCR :prod to main HEAD
        id: promote
        if: steps.image.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if PREV=$(docker buildx imagetools inspect "${GHCR_IMAGE}:prod" --format '{{.Manifest.Digest}}' 2>&1); then
            [[ "$PREV" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::지금 :prod 다이제스트를 읽지 못했습니다: $PREV"; exit 1; }
          elif printf '%s' "$PREV" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "::notice:::prod 가 아직 없습니다(첫 배포). 스모크가 실패해도 되돌릴 곳이 없습니다"
            PREV=""
          else
            echo "$PREV"; echo "::error::지금 :prod 조회가 매니페스트 부재가 아닌 이유로 실패했습니다. :prod 는 그대로입니다"; exit 1
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "$IMAGE"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "✅ GHCR :prod -> ${{ steps.gate.outputs.deploy_short_sha }} (직전 ${PREV:-없음})"

      # updater 가 :prod 를 보고 배포를 끝내 새 server 로 전환되면 /actuator/info 의 build.commit 이 main HEAD 가 된다.
      # 타이머 주기(약 1분)와 기동(약 1분)에 다른 서비스 배포의 잠금 대기까지 넉넉히 20분 기다린다.
      - name: Wait for OCI host to run main HEAD
        if: steps.promote.outputs.moved == 'true'
        env:
          DEPLOY_SHA: ${{ steps.gate.outputs.deploy_sha }}
        run: |
          for i in $(seq 1 80); do
            COMMIT=$(curl -fsS --max-time 10 https://api.manyak.app/actuator/info | jq -r '.build.commit // empty' || true)
            if [ "$COMMIT" = "$DEPLOY_SHA" ]; then
              echo "✅ 운영 server 가 $DEPLOY_SHA 로 바뀌었습니다"; exit 0
            fi
            echo "교체 대기 $i/80 (지금 ${COMMIT:-응답 없음}, 15s)..."; sleep 15
          done
          echo "::error::20분 안에 운영 server 가 $DEPLOY_SHA 로 바뀌지 않았습니다. 새 컨테이너가 헬스를 못 넘었으면 옛 server 가 계속 서비스합니다(updater 알림과 운영 로그 확인)"
          exit 1

      - name: Smoke test (/actuator/health)
        if: steps.promote.outputs.moved == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::health 200/UP 확인 실패 — 운영 로그 확인"; exit 1

      # 교체 대기나 스모크가 실패하면 :prod 를 직전 다이제스트로 되돌린다. updater 가 다음 주기에 직전 이미지로 다시 배포한다
      # (새 컨테이너가 처음부터 못 떴다면 지금 이미지와 같아 아무것도 하지 않는다). 완료는 기다리지 않는다 — 잡은 이미 실패다.
      - name: Roll back GHCR :prod on failure
        if: failure() && steps.promote.outputs.moved == 'true'
        env:
          PREV: ${{ steps.promote.outputs.prev }}
        run: |
          if [ -z "$PREV" ]; then
            echo "::warning::직전 :prod 가 없어 되돌리지 않았습니다. 운영 상태를 직접 확인하세요"; exit 0
          fi
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "${GHCR_IMAGE}@${PREV}"
          echo "::warning::실패로 GHCR :prod 를 직전 다이제스트($PREV)로 되돌렸습니다. updater 가 1~2분 안에 다시 배포합니다. 헬스를 직접 확인하세요"
