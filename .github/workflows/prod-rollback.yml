name: Prod image rollback

# GHCR :prod 를 입력한 main 커밋의 이미지로 옮긴다(KNK-2126). OCI 운영 호스트의 updater 가 :prod 다이제스트를 따라
# 배포하므로, 전환 뒤에는 이것이 SSH 없이 되돌리는 길이다. 전환 전에는 아무도 :prod 를 받지 않아 영향이 없다.
# AWS 운영 앱 호스트는 이 워크플로와 무관하다(그쪽 되돌리기는 SSM 문서 image=rollback).
# 다음 main 배포가 성공하면 :prod 는 다시 그 커밋으로 옮겨진다.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: ":prod 로 옮길 main 커밋 sha(7자 이상)"
        required: true
        type: string

permissions:
  contents: read
  packages: write # GHCR :prod 태그 이동

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-server

# 운영 배포(deploy-prod)와 같은 그룹으로 직렬화해 배포 중인 :prod 이동과 겹치지 않게 한다.
concurrency:
  group: manyak-prod-deploy
  cancel-in-progress: false

jobs:
  rollback:
    name: Move GHCR :prod
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # main 에 들어간 커밋만 받는다. dev 이미지나 아무 sha 를 운영으로 올리지 않게 한다.
      - name: Resolve main commit
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$INPUT_SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::sha 는 7~40자 소문자 16진수여야 합니다"
            exit 1
          fi
          if ! FULL=$(git rev-parse --verify --quiet "${INPUT_SHA}^{commit}"); then
            echo "::error::$INPUT_SHA 커밋을 찾지 못했습니다"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$FULL" origin/main; then
            echo "::error::$FULL 은 main 에 없는 커밋입니다"
            exit 1
          fi
          echo "short=${FULL::7}" >> "$GITHUB_OUTPUT"

      - name: Move :prod
        env:
          SHORT_SHA: ${{ steps.commit.outputs.short }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          SOURCE="${GHCR_IMAGE}:${SHORT_SHA}"
          docker buildx imagetools inspect "$SOURCE" >/dev/null
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "$SOURCE"
          echo "✅ GHCR :prod -> ${SHORT_SHA}"
