spring:
  datasource:
    # 테스트 컨텍스트마다 자기 인메모리 H2를 쓴다(KNK-2070). url을 두지 않으면 Spring Boot가 내장 DB URL
    # jdbc:h2:mem:<UUID>;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE를 만든다. UUID는 컨텍스트의 DataSourceProperties
    # 빈이 한 번 만들어 들고 있으므로, 같은 컨텍스트 안의 모든 빈은 같은 DB를 본다(${random.uuid}는 읽을 때마다 값이
    # 바뀌어 쓰지 않는다). 설정 파일 값이라 컨텍스트 캐시 키는 늘지 않는다.
    # 예전처럼 모든 컨텍스트가 jdbc:h2:mem:manyak-test 하나를 공유하면, H2의 IN 체크 제약이 테이블을 만든 커넥션에
    # 묶이는 탓에 마지막으로 스키마를 만든 컨텍스트의 커넥션 하나가 닫히는 순간 모든 컨텍스트의 insert가
    # "Check constraint invalid"(원인 "The database has been closed")로 깨졌다(KNK-2055 간헐 실패).
    # URL을 직접 지정한 조합(ChatCompactIntegrationTest 등)은 그 URL을 그대로 쓴다.
    generate-unique-name: true
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      # URL 대신 연결 속성으로 H2 호환 설정을 넘긴다(H2는 연결 속성으로 받은 설정도 URL 옵션과 같게 적용한다).
      data-source-properties:
        MODE: PostgreSQL
        DATABASE_TO_LOWER: "TRUE"
        DEFAULT_NULL_ORDERING: HIGH
  jpa:
    hibernate:
      # create-drop이 아니라 create다(KNK-686). 컨텍스트마다 DB가 따로라 종료 시 DROP이 남의 스키마를 지우는 일은
      # 이제 없지만, 바꿀 이유가 없어 부팅 시 drop+create만 하는 create를 유지한다.
      ddl-auto: create
    open-in-view: false
  flyway:
    enabled: false

management:
  health:
    redis:
      # 테스트는 Redis 인프라 없이 돈다. health를 Redis 가용성과 분리해 /actuator/health가 항상 200이도록 비활성화.
      enabled: false

manyak:
  admin:
    analytics:
      batch:
        enabled: false
  search:
    opensearch:
      endpoint: ""
      reindex-on-startup: false
  push:
    credit-expiry-reminder:
      enabled: false
    attendance-reminder:
      # 출석 리마인드 스케줄러를 끈다. 테스트는 스케줄러·서비스를 직접 호출해 실행 시점을 스스로 정한다.
      enabled: false
    promotion:
      # 프로모션 스케줄러도 끈다(테스트는 서비스를 직접 불러 회차 시각을 스스로 정한다).
      enabled: false
    template-refresh:
      # 문구 갱신 스케줄러도 끈다(테스트는 행을 넣고 refresh()를 직접 부른다).
      enabled: false
  auth:
    jwt:
      # 테스트 전용 고정 키(>=32바이트). 운영 키와 무관한 더미 값이다.
      secret: test-only-jwt-secret-fixed-value-32-bytes-min
      refresh-reuse-grace: PT10S
    google:
      # 테스트 전용 더미 client-id. 통합 테스트는 가짜 verifier(@Primary)를 쓰므로 실제 검증에는 쓰이지 않는다.
      client-ids: test-only.apps.googleusercontent.com
    kakao:
      # 위와 같은 이유의 더미 값(카카오 REST API 키 자리).
      client-ids: test-only-kakao-rest-api-key
  ai:
    moderation:
      poll-enabled: false
      stub: true
    base-url: http://localhost:8000
    chat:
      stub: true
  cors:
    allowed-origins: http://localhost:3000,http://192.168.0.12:3000
  credit:
    policy-refresh:
      # 정책 주기 갱신 스케줄러를 끈다. 테스트는 오버라이드를 넣은 뒤 CreditPolicyService.refresh()를 직접
      # 호출해 반영 시점을 스스로 정한다(주기에 기대면 시점 의존이 생긴다).
      enabled: false
    reconciliation:
      # 테스트는 대사 배치 스케줄러를 끈다. 대사 로직은 CreditReconciliationIntegrationTests가 서비스를 직접 호출해 검증한다.
      enabled: false
  slack:
    # 테스트는 외부로 절대 발송하지 않는다. 환경변수 오염까지 막는 최종 보장은 통합 테스트의 @DynamicPropertySource.
    feedback-webhook-url: ""
    # 검수 전용 웹훅과 신고 웹훅 폴백 모두 테스트 프로필에서 차단한다.
    moderation-webhook-url: ""
    report-webhook-url: ""
  google-form:
    feedback:
      # 테스트는 외부(구글)로 절대 발송하지 않는다. form-id 를 비워 발송을 끈다.
      form-id: ""
