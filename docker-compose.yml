services:
  postgres:
    image: postgres:16-alpine
    container_name: manyak-postgres
    environment:
      POSTGRES_DB: ${MANYAK_DB_NAME:?MANYAK_DB_NAME 값이 필요합니다}
      POSTGRES_USER: ${MANYAK_DB_USERNAME:?MANYAK_DB_USERNAME 값이 필요합니다}
      POSTGRES_PASSWORD: ${MANYAK_DB_PASSWORD:?MANYAK_DB_PASSWORD 값이 필요합니다}
    ports:
      - "${MANYAK_DB_PORT:?MANYAK_DB_PORT 값이 필요합니다}:5432"
    volumes:
      - manyak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    # 운영 ElastiCache 7.1과 메이저 일치(redis 7). AUTH/TLS 없는 로컬 개발용.
    image: redis:7-alpine
    container_name: manyak-redis
    ports:
      - "${MANYAK_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 인물 이미지 S3 검증용 로컬 오브젝트 스토리지(KNK-966·943). 로컬 9000은 다른 도구가 점유하는 일이 잦아 9100/9101로 게시한다.
  # 서버는 MANYAK_CHARACTER_IMAGE_ENDPOINT=http://127.0.0.1:9100으로 붙고, 자격증명은 AWS 기본 체인(AWS_ACCESS_KEY_ID/SECRET)을 쓴다.
  minio:
    image: minio/minio:latest
    container_name: manyak-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MANYAK_MINIO_ROOT_USER:-manyaklocal}
      MINIO_ROOT_PASSWORD: ${MANYAK_MINIO_ROOT_PASSWORD:-manyaklocal123}
    ports:
      - "${MANYAK_MINIO_PORT:-9100}:9000"
      - "${MANYAK_MINIO_CONSOLE_PORT:-9101}:9001"
    volumes:
      - manyak-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 버킷 생성 전용 1회성 컨테이너. 이미 있으면 그대로 두고(--ignore-existing) 즉시 종료한다.
  # 버킷이 없으면 서버는 업로드에 실패해 image_url NULL로 저장되므로, 검증 전에 이 잡이 한 번 돌아야 한다.
  minio-init:
    image: minio/mc:latest
    container_name: manyak-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 ${MANYAK_MINIO_ROOT_USER:-manyaklocal} ${MANYAK_MINIO_ROOT_PASSWORD:-manyaklocal123}
      && mc mb --ignore-existing local/${MANYAK_CHARACTER_IMAGE_BUCKET:-manyak-character-images}"

volumes:
  manyak-postgres-data:
  manyak-minio-data:
